<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Visualizar Ordens de Serviço</title>
<style>
:root {
  --bg-color: #f1f5f9;
  --sidebar-bg: #0f172a;
  --primary: #2563eb;
  --hover: #334155;
  --card-bg: #fff;
  --text-color: #f1f5f9;
  --button-bg: #2563eb;
  --button-hover: #1e40af;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

/* MENU LATERAL */
.sidebar {
  width: 240px; height: 100vh; background: var(--sidebar-bg);
  color: var(--text-color); display: flex; flex-direction: column;
  padding: 20px; position: fixed; transition: transform 0.3s ease;
}
.sidebar h3 { text-align: center; margin-bottom: 30px; font-size: 1.3em; }
.sidebar a {
  display: block; padding: 12px; margin-bottom: 5px;
  color: var(--text-color); text-decoration: none; border-radius: 6px; font-weight: 500;
}
.sidebar a:hover { background: var(--hover); }

/* BOTÃO MENU MOBILE */
.menu-toggle {
  display: none; position: fixed; top: 15px; left: 15px;
  background: var(--primary); border: none; padding: 10px 15px;
  color: #fff; border-radius: 6px; font-size: 16px; cursor: pointer; z-index: 1001;
}

/* CONTEÚDO PRINCIPAL */
.main { margin-left: 240px; padding: 30px; flex: 1; transition: margin-left 0.3s ease; }
.card { background: var(--card-bg); padding: 25px; border-radius: 14px; margin-bottom: 25px; box-shadow: 0 15px 30px rgba(0,0,0,0.05); }

/* TÍTULOS */
h3 { margin-top: 0; border-left: 5px solid var(--primary); padding-left: 10px; }

/* INPUTS E BOTÕES */
input, select, textarea, button {
  width: 100%; padding: 10px; margin-top: 10px;
  border-radius: 8px; border: 1px solid #cbd5e1;
}
button { background: var(--button-bg); color: #fff; font-weight: bold; cursor: pointer; }
button:hover { background: var(--button-hover); }

/* TABELA */
table { width: 100%; border-collapse: collapse; margin-top: 20px; min-width: 400px; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
th { background: #f1f5f9; }
textarea { resize: vertical; }

/* RESPONSIVO */
@media(max-width:768px){
  .sidebar { transform: translateX(-260px); height: 100%; position: fixed; z-index: 1000; }
  .sidebar.show { transform: translateX(0); }
  .main { margin-left: 0; padding: 20px; }
  .menu-toggle { display: block; }
}
</style>
</head>
<body>

<button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>

<div class="sidebar" id="sidebar">
  <h3>🛠 Sistema OS</h3>
  <a href="index.html">Entrada de Equipamento</a>
  <a href="clientes.html">Cadastro de Clientes</a>
  <a href="visualizar-os.html">Visualizar OS</a>
  <a href="financeiro.html">Financeiro</a>
  <a href="produtos.html">Produtos</a>
  <a href="visitas.html">Visitas Técnicas</a>
  <a href="backup.html">Backup / Restaurar</a>
</div>

<div class="main">

  <div class="card">
    <h3>Ordens em Aberto</h3>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>OS</th>
            <th>Cliente</th>
            <th>Descrição</th>
            <th>Status</th>
            <th>Valor</th>
            <th>Observação</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="listaAbertas"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3>Ordens Concluídas</h3>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>OS</th>
            <th>Cliente</th>
            <th>Valor</th>
            <th>PDF</th>
          </tr>
        </thead>
        <tbody id="listaConcluidas"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBSQrG5bdCGC_6kUQxccgJxz2gtLiB2Kb4",
  authDomain: "sistema-os-1284b.firebaseapp.com",
  projectId: "sistema-os-1284b",
  storageBucket: "sistema-os-1284b.appspot.com",
  messagingSenderId: "1032102605721",
  appId: "1:1032102605721:web:7eba5fc6e4eb9fc17ad908"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const osRef = collection(db, "os");

async function carregar() {
  const abertas = document.getElementById("listaAbertas");
  const concluidas = document.getElementById("listaConcluidas");
  abertas.innerHTML = "";
  concluidas.innerHTML = "";

  const snap = await getDocs(osRef);
  snap.forEach(d => {
    const os = d.data();
    const id = d.id;
    const valor = Number(os.valor) || 150;

    if(os.status === "Concluído") {
      concluidas.innerHTML += `
        <tr>
          <td>${os.osnum}</td>
          <td>${os.cliente}</td>
          <td>R$ ${valor.toFixed(2)}</td>
          <td>
            <button onclick='pdfOS(${JSON.stringify(os)})'>OS</button>
            <button onclick='recibo(${JSON.stringify(os)})'>Recibo</button>
            <button onclick="agendarVisita('${os.osnum}')">Agendar Visita</button>
          </td>
        </tr>
      `;
    } else {
      abertas.innerHTML += `
        <tr>
          <td>${os.osnum}</td>
          <td>${os.cliente}</td>
          <td><textarea id="d-${id}">${os.descricao || ""}</textarea></td>
          <td>
            <select id="s-${id}">
              <option ${os.status=="Pendente"?"selected":""}>Pendente</option>
              <option ${os.status=="Em bancada"?"selected":""}>Em bancada</option>
              <option ${os.status=="Orçamento pronto"?"selected":""}>Orçamento pronto</option>
              <option ${os.status=="Concluído"?"selected":""}>Concluído</option>
            </select>
          </td>
          <td><input type="number" id="v-${id}" value="${valor}"></td>
          <td><textarea id="o-${id}">${os.observacao || ""}</textarea></td>
          <td>
            <button onclick="salvar('${id}')">Salvar</button>
            <button onclick='pdfOS(${JSON.stringify(os)})'>PDF OS</button>
            <button onclick="agendarVisita('${os.osnum}')">Agendar Visita</button>
          </td>
        </tr>
      `;
    }
  });
}

async function salvar(id) {
  const status = document.getElementById(`s-${id}`).value;

  await updateDoc(doc(db, "os", id), {
    descricao: document.getElementById(`d-${id}`).value,
    observacao: document.getElementById(`o-${id}`).value,
    valor: Number(document.getElementById(`v-${id}`).value),
    status,
    financeiroStatus: status === "Concluído" ? "recebido" : "pendente"
  });

  carregar();
}

/* PDF OS */
function pdfOS(os) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();
  let y = 15;
  pdf.setFontSize(14); pdf.text("ORDEM DE SERVIÇO", 65, y); y+=8;
  pdf.setFontSize(10);
  pdf.text(`OS Nº: ${os.osnum}`, 14, y);
  pdf.text(`Data: ${new Date().toLocaleDateString()}`, 140, y); y+=6;
  pdf.text(`Cliente: ${os.cliente}`, 14, y); y+=6;
  pdf.text(`Telefone: ${os.telefone||""}`,14,y); y+=6;
  pdf.text(`Status: ${os.status}`,14,y); y+=6;
  pdf.text(`Valor: R$ ${(os.valor||150).toFixed(2)}`,14,y); y+=8;
  pdf.text("Descrição:",14,y); y+=6; pdf.text(os.descricao||"-",14,y); y+=8;
  pdf.text("Observações:",14,y); y+=6; pdf.text(os.observacao||"-",14,y); y+=12;
  pdf.text("Assinatura do Cliente:",14,y); pdf.line(60,y,150,y);
  pdf.save(`OS-${os.osnum}.pdf`);
}

// recibo
function recibo(os){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();
  let y=20;
  // Moldura
    pdf.setDrawColor(0, 51, 102);
    pdf.setLineWidth(0.8);
    pdf.rect(5, 5, 200, 287);

    // Cabeçalho
    pdf.setFillColor(0, 51, 102);
    pdf.rect(5, 5, 200, 25, "F");

    pdf.setTextColor(255, 255, 255);
    pdf.setFontSize(18);
    pdf.setFont(undefined, "bold");
    pdf.text("WSM INFORMÁTICA", 65, 16);

    pdf.setFontSize(10);
    pdf.setFont(undefined, "normal");
    pdf.text("Assistência Técnica Especializada", 65, 23);

    // Número do recibo
    pdf.setTextColor(0, 0, 0);
    pdf.setFontSize(12);
    pdf.setFont(undefined, "bold");
    pdf.text(`RECIBO Nº ${Date.now()}`, 14, 40);

    pdf.setFont(undefined, "normal");
    pdf.text(`Data: ${new Date().toLocaleDateString()}`, 150, 40);

    // Cliente
    pdf.setFillColor(230, 230, 230);
    pdf.rect(10, 50, 190, 10, "F");

    pdf.setFont(undefined, "bold");
    pdf.text("DADOS DO CLIENTE", 14, 57);

    pdf.setFont(undefined, "normal");

    pdf.text(`Nome: ${os.cliente || ""}`, 14, 70);
    pdf.text(`CPF/CNPJ: ${os.cpf || os.cnpj || "Não informado"}`, 14, 78);
    pdf.text(`Telefone: ${os.telefone || ""}`, 14, 86);

    // Equipamento
    pdf.setFillColor(230, 230, 230);
    pdf.rect(10, 95, 190, 10, "F");

    pdf.setFont(undefined, "bold");
    pdf.text("EQUIPAMENTO", 14, 102);

    pdf.setFont(undefined, "normal");

    pdf.text(`Equipamento: ${os.equipamento || ""}`, 14, 115);
    pdf.text(`Marca: ${os.marca || ""}`, 14, 123);
    pdf.text(`Nº Série: ${os.serie || ""}`, 14, 131);

    // Serviço
    pdf.setFillColor(230, 230, 230);
    pdf.rect(10, 140, 190, 10, "F");

    pdf.setFont(undefined, "bold");
    pdf.text("SERVIÇOS EXECUTADOS", 14, 147);

    pdf.setFont(undefined, "normal");

    pdf.text(`OS Nº: ${os.osnum}`, 14, 160);

    pdf.text(
        `Valor Recebido: R$ ${(os.valor || 150).toFixed(2)}`,
        14,
        168
    );

    pdf.text(
        `Descrição: ${os.descricao || ""}`,
        14,
        176
    );

    // Garantia
    pdf.setFillColor(255, 255, 204);
    pdf.rect(10, 190, 190, 28, "F");

    pdf.setFont(undefined, "bold");
    pdf.text("GARANTIA DO SERVIÇO", 14, 198);

    pdf.setFont(undefined, "normal");
    pdf.setFontSize(10);

    pdf.text(
        "Garantia de 30 dias para os serviços executados, e 90 dias para peças de nossa assistência.",
        14,
        206
    );

    pdf.text(
        "Não cobre mau uso, quedas, oxidação, líquidos ou violação do equipamento.",
        14,
        213
    );

    // Assinaturas
    pdf.line(20, 245, 90, 245);
    pdf.line(120, 245, 190, 245);

    pdf.text("Cliente", 45, 252);
    pdf.text("WSM Informática", 135, 252);

    // Rodapé
    pdf.setDrawColor(0, 51, 102);
    pdf.line(10, 275, 200, 275);

    pdf.setFontSize(9);
    pdf.text(
        "WSM Informática - Assistência Técnica Especializada",
        50,
        282
    );

    pdf.save(`Recibo-${os.osnum}.pdf`);
}

window.salvar=salvar;
window.pdfOS=pdfOS;
window.recibo=recibo;
carregar();

  
// MENU MOBILE
function toggleMenu(){ document.getElementById('sidebar').classList.toggle('show'); }

</script>
</body>
</html>
