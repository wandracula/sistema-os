<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO",
  storageBucket: "SEU_PROJETO.appspot.com",
  messagingSenderId: "SEU_MESSAGING_ID",
  appId: "SEU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let produtosLista = [];

async function carregarProdutos() {

  try {

    const snapshot = await getDocs(
      collection(db, "produtos")
    );

    produtosLista = [];

    snapshot.forEach((docSnap) => {

      const produto = docSnap.data();

      produtosLista.push({
        id: docSnap.id,
        ...produto
      });

    });

    filtrarProdutos();

  } catch (erro) {

    console.error(
      "Erro ao carregar produtos:",
      erro
    );

  }

}

window.filtrarProdutos = function () {

  const container =
    document.getElementById("produtos");

  const busca =
    document
      .getElementById("buscar")
      .value
      .toLowerCase();

  const categoria =
    document
      .getElementById("categoriaFiltro")
      .value;

  container.innerHTML = "";

  produtosLista.forEach((p) => {

    const nome = p.nome || "";
    const descricao = p.descricao || "";
    const valor = Number(p.valor || 0);

    if (
      categoria &&
      p.categoria !== categoria
    ) {
      return;
    }

    if (
      !nome
        .toLowerCase()
        .includes(busca)
    ) {
      return;
    }

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <img
        src="${
          p.foto ||
          "https://via.placeholder.com/400x250"
        }"
        alt="${nome}"
      >

      <div class="card-body">

        <h4>${nome}</h4>

        <p>${descricao}</p>

        <span class="preco">
          R$ ${valor.toFixed(2)}
        </span>

        <button
          class="btn-comprar"
          onclick="solicitarProduto(
            '${encodeURIComponent(nome)}',
            '${encodeURIComponent(descricao)}',
            '${valor}'
          )"
        >
          Comprar Agora
        </button>

      </div>
    `;

    container.appendChild(card);

  });

};

window.solicitarProduto = async (
  nome,
  descricao,
  valor
) => {

  const produtoNome =
    decodeURIComponent(nome);

  const produtoDescricao =
    decodeURIComponent(descricao);

  const assunto =
    encodeURIComponent(
      `Solicitação de Produto: ${produtoNome}`
    );

  const corpo =
    encodeURIComponent(
`Olá,

Gostaria de solicitar:

Nome: ${produtoNome}

Descrição: ${produtoDescricao}

Valor: R$ ${valor}`
    );

  window.location.href =
    `mailto:contato@sistemaos.com?subject=${assunto}&body=${corpo}`;

  try {

    await addDoc(
      collection(db, "financeiro"),
      {
        descricao: produtoNome,
        valor: Number(valor),
        status: "a receber",
        data: new Date().toISOString(),
        tipo: "produto"
      }
    );

  } catch (erro) {

    console.error(
      "Erro ao salvar financeiro:",
      erro
    );

  }

};

carregarProdutos();

</script>
