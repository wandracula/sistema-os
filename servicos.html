async function salvarServico(){
 const cliente=document.getElementById('cliente').value;
 const solicitante=document.getElementById('solicitante').value;
 const descricao=document.getElementById('descricao').value;
 const valor=Number(document.getElementById('valor').value);

   cliente,solicitante,descricao,valor,status:"Pendente",data:serverTimestamp()
 });
 carregar();

async function carregarClientes() {

    const snap = await getDocs(clientesRef);

    const select =
        document.getElementById("clienteSelect");

    select.innerHTML =
        `<option value="">-- Selecionar Cliente --</option>`;

    snap.forEach(doc => {

        const cliente = doc.data();

        const option =
            document.createElement("option");

        option.value = cliente.nome;
        option.textContent = cliente.nome;

        select.appendChild(option);

    });

}

    await addDoc(collection(db,"servicosRapidos"),{
    cliente,
    solicitante,
    descricao,
    valor,
    status:"Pendente",
    data:new Date()
});
    
async function carregar(){
 const tb=document.getElementById('lista');
 tb.innerHTML='';
 const snap=await getDocs(collection(db,"servicosRapidos"));
 snap.forEach(d=>{
   const s=d.data();
   tb.innerHTML+=`<tr>
   <td>${s.cliente||''}</td>
   <td>${s.solicitante||''}</td>
   <td>${s.descricao||''}</td>
   <td>R$ ${(Number(s.valor)||0).toFixed(2)}</td>
   <td>${s.status||''}</td>
   </tr>`;
 });
}

window.salvarServico = salvarServico;
