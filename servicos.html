<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serviços Rápidos</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0}
.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;background:#0f172a;color:#fff;padding:20px;box-sizing:border-box}
.sidebar a{display:block;color:#fff;text-decoration:none;padding:10px;border-radius:6px}
.sidebar a:hover{background:#334155}
.main{margin-left:260px;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px}
input,textarea,button{width:100%;padding:10px;margin-top:8px;box-sizing:border-box}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:8px}
button{background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <h3>🛠 WSM Informatica </h3>
  <a href="index.html">Entrada de Equipamento</a>
  <a href="clientes.html">Cadastro de Clientes</a>
  <a href="visualizar-os.html">Visualizar OS</a>
  <a href="financeiro.html">Financeiro</a>
  <a href="produtos.html">Produtos</a>
  <a href="visitas.html">Visitas Técnicas</a>
  <a href="servicos.html">Serviços</a>
  <a href="backup.html">Backup / Restaurar</a>
</div>

<div class="main">
<div class="card">
<h2>Novo Serviço</h2>
<label>Cliente</label>

<select id="clienteSelect">
    <option value="">-- Selecionar Cliente --</option>
</select>
<input id="solicitante" placeholder="Solicitante">
<textarea id="descricao" placeholder="Descrição"></textarea>
<input id="valor" type="number" placeholder="Valor">
<button onclick="salvarServico()">Salvar Serviço</button>
</div>

<div class="card">
<h2>Serviços</h2>
<table>
<thead>
<tr>
  <th>Cliente</th>
  <th>Solicitante</th>
  <th>Descrição</th>
  <th>Valor</th>
  <th>Ações</th>
</tr>
</thead>
<tbody id="lista"></tbody>
</table>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "sistema-os-1284b.firebaseapp.com",
  projectId: "sistema-os-1284b",
  storageBucket: "sistema-os-1284b.appspot.com",
  messagingSenderId: "1032102605721",
  appId: "1:1032102605721:web:7eba5fc6e4eb9fc17ad908"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const clientesRef = collection(db, "clientes");
const servicosRef = collection(db, "servicosRapidos");

async function carregarClientes() {
  const snap = await getDocs(clientesRef);

  const select =
    document.getElementById("clienteSelect");

  select.innerHTML =
    `<option value="">-- Selecionar Cliente --</option>`;

  snap.forEach(docSnap => {

    const cliente = docSnap.data();

    const option =
      document.createElement("option");

    option.value = cliente.nome;
    option.textContent = cliente.nome;

    select.appendChild(option);

  });
}

async function salvarServico() {

  const cliente =
    document.getElementById("clienteSelect").value;

  const solicitante =
    document.getElementById("solicitante").value;

  const descricao =
    document.getElementById("descricao").value;

  const valor =
    Number(document.getElementById("valor").value);

  if (!cliente) {
    alert("Selecione um cliente");
    return;
  }

  await addDoc(servicosRef, {
    cliente,
    solicitante,
    descricao,
    valor,
    status: "Pendente",
    enviadoFinanceiro: false,
    data: serverTimestamp()
  });

  document.getElementById("solicitante").value = "";
  document.getElementById("descricao").value = "";
  document.getElementById("valor").value = "";

  carregar();
}

async function carregar() {

  const tabela =
    document.getElementById("lista");

  tabela.innerHTML = "";

  const snap =
    await getDocs(servicosRef);

  const clientes = {};

  snap.forEach(docSnap => {

    const servico = docSnap.data();

    if(servico.enviadoFinanceiro)
      return;

    if(!clientes[servico.cliente]){

      clientes[servico.cliente] = {
        total:0,
        servicos:[]
      };

    }

    clientes[servico.cliente]
      .total += Number(servico.valor || 0);

    clientes[servico.cliente]
      .servicos.push({
        id: docSnap.id,
        ...servico
      });

  });

  Object.keys(clientes).forEach(cliente => {

    const grupo = clientes[cliente];

    tabela.innerHTML += `
      <tr style="background:#dbeafe;font-weight:bold">
        <td colspan="5">
          ${cliente}
          | Total: R$ ${grupo.total.toFixed(2)}
          <br>
          <button onclick="enviarFinanceiro('${cliente}')">
            Finalizar Cliente
          </button>
        </td>
      </tr>
    `;

    grupo.servicos.forEach(servico => {

      tabela.innerHTML += `
      <tr>
        <td>${servico.cliente}</td>
        <td>${servico.solicitante}</td>
        <td>${servico.descricao}</td>
        <td>R$ ${Number(servico.valor).toFixed(2)}</td>
        <td>

          <button onclick="editarServico('${servico.id}')">
            Editar
          </button>

          <button onclick="excluirServico('${servico.id}')">
            Excluir
          </button>

        </td>
      </tr>
      `;

    });

  });

}

async function editarServico(id){

  const novoValor =
    prompt("Novo valor:");

  if(!novoValor)
    return;

  await updateDoc(
    doc(db,"servicosRapidos",id),
    {
      valor:Number(novoValor)
    }
  );

  carregar();
}

async function excluirServico(id){

  if(!confirm("Excluir serviço?"))
    return;

  await deleteDoc(
    doc(db,"servicosRapidos",id)
  );

  carregar();
}

async function enviarFinanceiro(cliente){

  const snap =
    await getDocs(servicosRef);

  let total = 0;

  let descricao = "";

  const atualizar = [];

  snap.forEach(docSnap => {

    const servico = docSnap.data();

    if(
      servico.cliente === cliente &&
      !servico.enviadoFinanceiro
    ){

      total +=
        Number(servico.valor || 0);

      descricao +=
        `• ${servico.descricao}\n`;

      atualizar.push(docSnap.id);

    }

  });

  if(total === 0){
    alert("Nenhum serviço pendente.");
    return;
  }

  await addDoc(
    collection(db,"financeiro"),
    {
      cliente,
      descricao,
      valor: total,
      origem:"Serviços Rápidos",
      status:"Receber",
      data: serverTimestamp()
    }
  );

  for(const id of atualizar){

    await updateDoc(
      doc(db,"servicosRapidos",id),
      {
        enviadoFinanceiro:true,
        status:"Finalizado"
      }
    );

  }

  alert("Enviado ao financeiro!");

  carregar();
}

window.salvarServico = salvarServico;
window.editarServico = editarServico;
window.excluirServico = excluirServico;
window.enviarFinanceiro = enviarFinanceiro;

carregarClientes();
carregar();
    </script>
</script>
</body>
</html>
