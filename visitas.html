<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Agendamento de Visitas</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<style>

body{
font-family:Arial;
background:#f1f5f9;
margin:0;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:10px;
}

button{
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

#calendar{
background:white;
padding:15px;
border-radius:12px;
}

</style>

</head>
<body>

<div class="card">

<h2>📅 Nova Visita</h2>

<input id="osnum" placeholder="Número da OS">

<input id="cliente" placeholder="Cliente">

<input id="telefone" placeholder="Telefone">

<select id="tipo">
<option>Orçamento</option>
<option>Manutenção</option>
<option>Entrega</option>
<option>Instalação</option>
<option>Retorno</option>
</select>

<input id="data" type="date">

<input id="hora" type="time">

<textarea id="obs" placeholder="Observações"></textarea>

<button onclick="salvarVisita()">
Salvar Visita
</button>

</div>

<div id="calendar"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyBSQrG5bdCGC_6kUQxccgJxz2gtLiB2Kb4",
authDomain: "sistema-os-1284b.firebaseapp.com",
projectId: "sistema-os-1284b",
storageBucket: "sistema-os-1284b.appspot.com",
messagingSenderId: "1032102605721",
appId: "1:1032102605721:web:7eba5fc6e4eb9fc17ad908"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.salvarVisita = async ()=>{

await addDoc(collection(db,"visitas"),{

osnum: osnum.value,

cliente: cliente.value,

telefone: telefone.value,

tipo: tipo.value,

data: data.value,

hora: hora.value,

obs: obs.value,

status:"Agendada"

});

alert("Visita cadastrada");

location.reload();

}

const calendar = new FullCalendar.Calendar(
document.getElementById('calendar'),
{
initialView:'dayGridMonth',
locale:'pt-br',
events:[]
});

calendar.render();

const snap = await getDocs(collection(db,"visitas"));

snap.forEach(doc=>{

const v = doc.data();

calendar.addEvent({

title:
`${v.hora} - ${v.cliente}`,

start:v.data

});

});

</script>

</body>
</html>
