<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Agendamento de Visitas</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<style>

body{
font-family:Arial;
background:#f1f5f9;
margin:0;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:10px;
}

button{
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

#calendar{
background:white;
padding:15px;
border-radius:12px;
}

</style>

</head>
<body>

<div class="card">

<h2>📅 Nova Visita</h2>


<input id="cliente" placeholder="Cliente">

<input id="telefone" placeholder="Telefone">

<select id="tipo">
<option>Orçamento</option>
<option>Manutenção</option>
<option>Entrega</option>
<option>Instalação</option>
<option>Retorno</option>
</select>

<input id="data" type="date">

<input id="hora" type="time">

<textarea id="obs" placeholder="Observações"></textarea>

<button onclick="salvarVisita()">
Salvar Visita
</button>

</div>

<div id="calendar"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const db = getFirestore(app);

  async function gerarNumeroOS(){

    const snap = await getDocs(
        collection(db,"visitas")
    );

    if(snap.empty) return 1000;

    const numeros = snap.docs.map(d =>
        Number(d.data().osnum || 0)
    );

    return Math.max(...numeros) + 1;
}





  
  
const firebaseConfig = {

apiKey: "AIzaSyBSQrG5bdCGC_6kUQxccgJxz2gtLiB2Kb4",
authDomain: "sistema-os-1284b.firebaseapp.com",
projectId: "sistema-os-1284b",
storageBucket: "sistema-os-1284b.appspot.com",
messagingSenderId: "1032102605721",
appId: "1:1032102605721:web:7eba5fc6e4eb9fc17ad908"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.salvarVisita = async ()=>{

    const osnum = await gerarNumeroOS();

    await addDoc(collection(db,"visitas"),{

        osnum,

        cliente: cliente.value,

        telefone: telefone.value,

        tipo: tipo.value,

        data: data.value,

        hora: hora.value,

        obs: obs.value,

        status:"Agendada",

        criadoEm:new Date()

    });

    alert(
      `Visita cadastrada com sucesso!\nOS Nº ${osnum}`
    );

    location.reload();
}

const calendar = new FullCalendar.Calendar(
document.getElementById('calendar'),
{
initialView:'dayGridMonth',
locale:'pt-br',
events:[]
});

calendar.render();

  calendar.on('eventClick', async function(info){

    const e = info.event;

    const confirmar = confirm(

`OS: ${e.title}

Tipo: ${e.extendedProps.tipo}

Telefone: ${e.extendedProps.telefone}

Deseja excluir esta visita?`

    );

    if(confirmar){

        await deleteDoc(
            doc(db,"visitas",e.id)
        );

        e.remove();

        alert("Visita removida.");
    }

});

  
const params =
new URLSearchParams(location.search);

osnum.value =
params.get("os") || "";


  
const snap = await getDocs(
    collection(db,"visitas")
);

snap.forEach(d=>{

    const v = d.data();

    calendar.addEvent({

        id:d.id,

       title:
`${v.hora} - ${v.cliente}`,

start:v.data

        extendedProps:{
            telefone:v.telefone,
            tipo:v.tipo,
            hora:v.hora,
            obs:v.obs
        }

    });

});

</script>

</body>
</html>
